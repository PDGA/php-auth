version: '3.8'
services:
  php:
    image: php:8.1-cli-alpine
    volumes:
      - ./:/var/auth
    working_dir: /var/auth

  composer:
    command: -V
    image: composer:2.4
    volumes:
      - ./:/var/auth
    working_dir: /var/auth

  codesniffer:
    image: php:7.4-cli-alpine3.16
    volumes:
      - ./:/var/pdga
    working_dir: /var/pdga

