services:
  php:
    image: php:8.3-cli-alpine
    volumes:
      - ./:/var/auth
    working_dir: /var/auth

  composer:
    command: -V
    image: composer:2.7
    volumes:
      - ./:/var/auth
    working_dir: /var/auth

  codesniffer:
    image: php:8.3-cli-alpine
    volumes:
      - ./:/var/pdga
    working_dir: /var/pdga

